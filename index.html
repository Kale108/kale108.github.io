<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inmobiliaria Canteras | Búsqueda Inteligente</title>
    <style>
        :root {
            --azul-oscuro: #0b2545;
            --azul-medio: #134074;
            --dorado: #c5a880;
            --gris-claro: #f4f6f9;
            --blanco: #ffffff;
            --texto: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--gris-claro);
            color: var(--texto);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Encabezado / Navbar */
        header {
            background-color: var(--azul-oscuro);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            color: var(--blanco);
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        header span {
            color: var(--dorado);
        }

        /* Contenedor Principal */
        .container {
            flex: 1;
            max-width: 600px;
            width: 90%;
            margin: 40px auto;
            background: var(--blanco);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        .intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .intro h2 {
            color: var(--azul-medio);
            margin-bottom: 10px;
            font-size: 22px;
        }

        .intro p {
            color: #666;
            font-size: 15px;
            line-height: 1.5;
        }

        /* Formulario */
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: var(--azul-oscuro);
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        select {
            padding: 12px 15px;
            border: 2px solid #e1e6eb;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
            background-color: #fafbfc;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus {
            border-color: var(--azul-medio);
            background-color: var(--blanco);
        }

        /* Botón de Enviar */
        button {
            background-color: var(--azul-medio);
            color: var(--blanco);
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--azul-oscuro);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #999;
            background-color: #fff;
            border-top: 1px solid #e1e6eb;
        }
    </style>
</head>
<body>
<!-- Encabezado con la Marca -->
<header>
    <img src="https://kale108.github.io/image_e07266.png" alt="Logo Inmobiliaria Canteras" style="max-width: 180px; height: auto; display: block; margin: 0 auto; margin-bottom: 10px;">
    <h1>Inmobiliaria <span>Canteras</span></h1>
</header>
    <!-- Contenedor del Formulario -->
    <div class="container">
        <div class="intro">
            <h2>Perfilamiento Inmobiliario Inteligente</h2>
            <p>Encuentra tu propiedad ideal sin perder tiempo. Llena este breve formulario en 1 minuto y nuestro sistema filtrará las mejores opciones para ti.</p>
        </div>

        <!-- REEMPLAZA EL LINK DE ENLACE_DE_TU_WEBHOOK POR TU URL DE MAKE -->
        <form action="https://hook.us2.make.com/nf6jebhtwtimni6mp3ht55fp12wufsh5" method="POST">
            
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="presupuesto">Rango de Presupuesto (Segmento)</label>
                <select id="presupuesto" name="presupuesto" required>
                    <option value="" disabled selected>Selecciona una opción...</option>
                    <option value="Estándar">Estándar (Propiedades residenciales y de entrada)</option>
                    <option value="Premium">Premium (Propiedades exclusivas de alta gama)</option>
                </select>
            </div>

            <button type="submit">Enviar mi perfil</button>
        </form>
    </div>

    <footer>
        &copy; 2026 Inmobiliaria Canteras. Todos los derechos reservados.
    </footer>

</body>
</html>

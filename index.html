<form action="https://hook.us2.make.com/nf6jebhtwtimni6mp3ht55fp12wufsh5" method="POST">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>

    <label for="tipo">¿Qué buscas hacer?</label>
    <select id="tipo" name="tipo">
        <option value="comprar">Comprar propiedad</option>
    </select>

    <label for="presupuesto">Rango de presupuesto:</label>
    <select id="presupuesto" name="presupuesto" required>
        <option value="premium">Premium</option>
        <option value="estandar">Estándar</option>
    </select>

    <label for="email">¿A qué correo te enviamos las opciones?</label>
    <input type="email" id="email" name="email" placeholder="tu@correo.com" required>

    <button type="submit">Enviar mi perfil</button>
</form>
